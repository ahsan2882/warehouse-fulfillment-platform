openapi: 3.0.3
info:
  title: Catalog Service API
  description: >
    Product Catalog Microservice - Manages product catalog with CRUD operations,
    SKU uniqueness enforcement, and business validation rules.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8080/api/v1/products
    description: Local development server

tags:
  - name: Products
    description: Product catalog operations
  - name: Errors
    description: Error responses

paths:
  /products:
    get:
      tags:
        - Products
      summary: List all products
      operationId: listProducts
      parameters:
        - name: page
          in: query
          description: Page number (0-indexed)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: isActive
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Products
      summary: Update product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/sku/{sku}:
    get:
      tags:
        - Products
      summary: Get product by SKU (active products only)
      operationId: getProductBySku
      parameters:
        - name: sku
          in: path
          required: true
          description: Product SKU (must be active)
          schema:
            type: string
            pattern: '^[A-Z]{3,5}-[0-9]{4}$'
      responses:
        '200':
          description: Active product by SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    CreateProductRequest:
      type: object
      required:
        - sku
        - name
        - quantityInStock
      properties:
        sku:
          type: string
          pattern: '^[A-Z]{3,5}-[0-9]{4}$'
          description: Unique product SKU (e.g., "ABC-1234")
          minLength: 7
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Product name
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional product description
        unitOfMeasure:
          type: string
          enum: [PCS, KG, L, ML, M, YD, FT]
          default: PCS
          description: Unit of measurement for stock
        quantityInStock:
          type: integer
          minimum: 0
          description: Current stock quantity
      description: Request body for creating a new product

    UpdateProductRequest:
      type: object
      properties:
        sku:
          type: string
          pattern: '^[A-Z]{3,5}-[0-9]{4}$'
          minLength: 7
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        unitOfMeasure:
          type: string
          enum: [PCS, KG, L, ML, M, YD, FT]
          default: PCS
        quantityInStock:
          type: integer
          minimum: 0

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Product UUID
        sku:
          type: string
          pattern: '^[A-Z]{3,5}-[0-9]{4}$'
          description: Unique product SKU
        name:
          type: string
          description: Product name
        description:
          type: string
          nullable: true
          description: Product description
        unitOfMeasure:
          type: string
          enum: [PCS, KG, L, ML, M, YD, FT]
          default: PCS
        quantityInStock:
          type: integer
          minimum: 0
          description: Current stock quantity
        is_active:
          type: boolean
          description: Product active status
        created_at:
          type: string
          format: date-time
          description: Creation timestamp

    ProductListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        pageable:
          type: object
          additionalProperties: true
        totalElements:
          type: integer
          description: Total number of elements
        totalPages:
          type: integer
          description: Total number of pages

  responses:
    BadRequest:
      description: Invalid request parameters or validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
    Conflict:
      description: Product with same SKU already exists (SKU uniqueness violation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
    NotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

tags:
  - name: Errors
    description: Error response schemas